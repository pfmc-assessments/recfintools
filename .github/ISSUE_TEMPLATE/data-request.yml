name: Data request
description: >
  Request RecFIN data through a tracked issue.
title: "Data request for species <replace with your species>"
labels: ["type: request", "topic: database"]
assignees:
  - brianlangseth-NOAA
body:
  - type: markdown
    attributes:
      value: >
        Thank you for taking the time to fill out the RecFIN request form.
  - type: textarea
    id: species
    attributes:
      label: Identify the species name(s) for this request
      description: >
        Please list the common name(s) and, if known, the relevant species
        code(s).
    validations:
      required: true
  - type: textarea
    id: info
    attributes:
      label: Additional information
      description: >
        Please provide any additional information relevant to your data pull.
  - type: checkboxes
    id: signed_forms
    attributes:
      label: PSMFC signed forms confirmation
      description: >
        By checking the following box you confirm that you have the required
        signed forms on file with PSMFC for PacFIN/RecFIN confidential data
        access.
      options:
        - label: I confirm the required signed forms are on file with PSMFC
          required: true
